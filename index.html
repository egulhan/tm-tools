<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toastmasters Araçları</title>
<style>
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --text: #1b1e25; --muted: #6a6f7b; --border: #e2dfd8; --accent: #772432;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --surface: #171b21; --text: #e9ebef; --muted: #98a0ad; --border: #2a303a; --accent: #e07a8a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); font-size: 15px; -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.tool { display: block; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border);
           border-radius: 12px; color: inherit; text-decoration: none; }
  a.tool:hover, a.tool:focus-visible { border-color: var(--accent); outline: none; }
  a.tool strong { display: block; font-size: 16px; margin-bottom: 2px; }
  a.tool span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Toastmasters Araçları</h1>
  <p class="sub">Toplantı rolleri için yardımcı araçlar.</p>
  <ul>
    <li><a class="tool" href="ah-eh-sayaci.html">
      <strong>Ah-Eh Sayacı</strong>
      <span>Konuşmacıların dolgu kelimelerini toplantı sırasında say ve raporla.</span>
    </a></li>
  </ul>
</main>
</body>
</html>
